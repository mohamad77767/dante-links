<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050609">
<title>DANTE — Official Links</title>
<style>
:root{
  color-scheme:dark;
  --bg:#050609;
  --panel:#111216;
  --line:#292b31;
  --muted:#aaa;
  --white:#f5f5f5;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  position:relative;
  isolation:isolate;
  overflow-x:hidden;
  margin:0;
  min-height:100svh;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(37,40,49,.22),transparent 58%),
    linear-gradient(180deg,#07080c 0%,#050609 65%,#030407 100%);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  display:grid;
  place-items:center;
  padding:28px 18px;
}
.bg-word{
  position:fixed;
  z-index:-2;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
  overflow:hidden;
  color:rgba(220,225,238,.035);
  font-family:Georgia,serif;
  font-size:clamp(180px,48vw,520px);
  font-weight:900;
  letter-spacing:-.09em;
  text-shadow:0 0 55px rgba(220,230,255,.025);
  user-select:none;
}
#meteors{
  position:fixed;
  z-index:-1;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}
.meteor{
  position:absolute;
  top:-24px;
  left:var(--x);
  width:var(--size);
  height:var(--size);
  border-radius:50%;
  opacity:0;
  background:#fff;
  box-shadow:
    0 0 4px 1px rgba(255,255,255,.5),
    0 0 10px 2px rgba(220,232,255,.18);
  animation:fall var(--duration) linear var(--delay) infinite;
  will-change:transform,opacity;
}
.meteor::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:50%;
  width:1px;
  height:var(--tail);
  transform:translateX(-50%);
  background:linear-gradient(to top,rgba(255,255,255,.24),rgba(255,255,255,0));
  filter:blur(.35px);
}
@keyframes fall{
  0%{transform:translate3d(0,-5vh,0);opacity:0}
  8%{opacity:var(--bright)}
  85%{opacity:var(--bright)}
  100%{transform:translate3d(var(--drift),110vh,0);opacity:0}
}
main{
  width:min(100%,430px);
  text-align:center;
  position:relative;
  z-index:1;
}
.avatar{
  width:116px;
  height:116px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid #777;
  box-shadow:0 0 0 7px #ffffff0a,0 12px 40px #000;
}
h1{
  font-family:Georgia,serif;
  font-size:42px;
  letter-spacing:3px;
  margin:23px 0 6px;
}
.tag{color:var(--muted);font-size:14px;letter-spacing:2px;margin:0 0 30px}
.intro{color:#c9c9c9;font-size:14px;line-height:1.7;margin:0 0 24px}
.links{display:grid;gap:15px}

/* Dante-style link frames */
.links a{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  min-height:70px;
  padding:12px 18px;
  border:1px solid #51434a;
  border-radius:5px;
  background:
    linear-gradient(135deg,rgba(25,19,23,.97),rgba(8,9,13,.97));
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  color:#f5f2f2;
  text-decoration:none;
  font-size:17px;
  font-weight:600;
  letter-spacing:.5px;
  backdrop-filter:blur(5px);
  clip-path:polygon(
    0 13px,13px 0,
    calc(100% - 13px) 0,100% 13px,
    100% calc(100% - 13px),
    calc(100% - 13px) 100%,
    13px 100%,0 calc(100% - 13px)
  );
  transition:transform .25s,filter .25s,background .25s;
}

/* Inner metallic frame */
.links a::before{
  content:"";
  position:absolute;
  z-index:-1;
  inset:4px;
  border:1px solid rgba(220,205,210,.16);
  clip-path:polygon(
    0 9px,9px 0,
    calc(100% - 9px) 0,100% 9px,
    100% calc(100% - 9px),
    calc(100% - 9px) 100%,
    9px 100%,0 calc(100% - 9px)
  );
  pointer-events:none;
}

/* Moving crimson light */
.links a::after{
  content:"";
  position:absolute;
  z-index:0;
  top:-20%;
  left:-55%;
  width:38%;
  height:140%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(170,20,38,.08),
    rgba(220,35,55,.38),
    rgba(255,80,90,.12),
    transparent
  );
  transform:skewX(-25deg);
  animation:danteGlow 5s ease-in-out infinite;
  pointer-events:none;
}

.links a:nth-child(2)::after{
  animation-delay:2.5s;
}

.links a:hover{
  transform:translateY(-3px);
  filter:
    drop-shadow(0 0 5px rgba(180,25,42,.35))
    drop-shadow(0 0 12px rgba(180,25,42,.16));
  background:linear-gradient(135deg,#211519,#0d0b10);
}

.links a:active{
  transform:scale(.98);
}

@keyframes danteGlow{
  0%,15%{left:-55%;opacity:0}
  25%{opacity:1}
  75%{opacity:1}
  100%{left:120%;opacity:0}
}

.icon{
  width:23px;
  height:23px;
  display:inline-grid;
  place-items:center;
  font-size:20px;
  position:relative;
  z-index:1;
}
.links a{
  text-shadow:0 0 8px rgba(255,255,255,.12);
}
.links a > *{
  position:relative;
  z-index:1;
}
footer{
  margin-top:35px;
  color:#777;
  font-size:11px;
  letter-spacing:2px;
}

@media(prefers-reduced-motion:reduce){
  .meteor{animation:none;display:none}
  .links a::after{animation:none;display:none}
  .links a{transition:none}
}
</style>
</head>
<body>
<div class="bg-word" aria-hidden="true">T7S</div>
<div id="meteors" aria-hidden="true"></div>

<main>
  <img class="avatar" src="dante-avatar.jpg" alt="DANTE profile picture">
  <h1>DANTE</h1>
  <p class="tag">@xu5._</p>
  <p class="intro">Official links<br>قناة التليگرام و الديسكورد</p>

  <nav class="links" aria-label="Official links">
    <a href="https://discord.gg/BGv2pTDDXn" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">◈</span>
      Discord Server
    </a>
    <a href="https://t.me/T7S_Cmmty" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">➤</span>
      Telegram Community
    </a>
  </nav>

  <footer>T7S · OFFICIAL</footer>
</main>

<script>
(() => {
  const layer = document.getElementById('meteors');
  const amount = 50;

  for (let i = 0; i < amount; i++) {
    const dot = document.createElement('span');
    dot.className = 'meteor';

    const size = (Math.random() * 1.7 + 1).toFixed(2);
    const duration = (Math.random() * 9 + 9).toFixed(2);
    const delay = (Math.random() * -18).toFixed(2);
    const drift = (Math.random() * 100 - 50).toFixed(0) + 'px';
    const tail = (Math.random() * 15 + 9).toFixed(0) + 'px';
    const bright = (Math.random() * 0.35 + 0.18).toFixed(2);

    dot.style.setProperty('--x', (Math.random() * 100).toFixed(2) + 'vw');
    dot.style.setProperty('--size', size + 'px');
    dot.style.setProperty('--duration', duration + 's');
    dot.style.setProperty('--delay', delay + 's');
    dot.style.setProperty('--drift', drift);
    dot.style.setProperty('--tail', tail);
    dot.style.setProperty('--bright', bright);

    layer.appendChild(dot);
  }
})();
</script>
</body>
</html>
