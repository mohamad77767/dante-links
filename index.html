<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050609">
<title>DANTE — Official Links</title>
<style>
:root{
  color-scheme:dark;
  --bg:#050609;
  --panel:#111216;
  --line:#292b31;
  --muted:#aaa;
  --white:#f5f5f5;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  position:relative;
  isolation:isolate;
  overflow-x:hidden;
  margin:0;
  min-height:100svh;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(37,40,49,.22),transparent 58%),
    linear-gradient(180deg,#07080c 0%,#050609 65%,#030407 100%);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  display:grid;
  place-items:center;
  padding:28px 18px;
}
.bg-word{
  position:fixed;
  z-index:-2;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
  overflow:hidden;
  color:rgba(220,225,238,.035);
  font-family:Georgia,serif;
  font-size:clamp(180px,48vw,520px);
  font-weight:900;
  letter-spacing:-.09em;
  text-shadow:0 0 55px rgba(220,230,255,.025);
  user-select:none;
}
#meteors{
  position:fixed;
  z-index:-1;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}
.meteor{
  position:absolute;
  top:-24px;
  left:var(--x);
  width:var(--size);
  height:var(--size);
  border-radius:50%;
  opacity:0;
  background:#fff;
  box-shadow:
    0 0 4px 1px rgba(255,255,255,.5),
    0 0 10px 2px rgba(220,232,255,.18);
  animation:fall var(--duration) linear var(--delay) infinite;
  will-change:transform,opacity;
}
.meteor::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:50%;
  width:1px;
  height:var(--tail);
  transform:translateX(-50%);
  background:linear-gradient(to top,rgba(255,255,255,.24),rgba(255,255,255,0));
  filter:blur(.35px);
}
@keyframes fall{
  0%{transform:translate3d(0,-5vh,0);opacity:0}
  8%{opacity:var(--bright)}
  85%{opacity:var(--bright)}
  100%{transform:translate3d(var(--drift),110vh,0);opacity:0}
}
main{
  width:min(100%,430px);
  text-align:center;
  position:relative;
  z-index:1;
}
.avatar{
  width:116px;
  height:116px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid #777;
  box-shadow:0 0 0 7px #ffffff0a,0 12px 40px #000;
}
h1{
  font-family:Georgia,serif;
  font-size:42px;
  letter-spacing:3px;
  margin:23px 0 6px;
}
.tag{color:var(--muted);font-size:14px;letter-spacing:2px;margin:0 0 30px}
.intro{color:#c9c9c9;font-size:14px;line-height:1.7;margin:0 0 24px}
.links{display:grid;gap:13px}
a{
  min-height:62px;
  border:1px solid #373941;
  border-radius:14px;
  background:linear-gradient(135deg,rgba(23,24,29,.94),rgba(10,11,15,.94));
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  color:#fff;
  text-decoration:none;
  font-size:17px;
  font-weight:700;
  transition:transform .18s,border-color .18s,background .18s;
  backdrop-filter:blur(5px);
}
a:hover{transform:translateY(-2px);border-color:#aaa;background:#1d1e24}
.icon{width:23px;height:23px;display:inline-grid;place-items:center;font-size:20px}
footer{margin-top:35px;color:#777;font-size:11px;letter-spacing:2px}
@media(prefers-reduced-motion:reduce){
  .meteor{animation:none;display:none}
  a{transition:none}
}
</style>
</head>
<body>
<div class="bg-word" aria-hidden="true">T7S</div>
<div id="meteors" aria-hidden="true"></div>

<main>
  <img class="avatar" src="dante-avatar.jpg" alt="DANTE profile picture">
  <h1>DANTE</h1>
  <p class="tag">@xu5._</p>
  <p class="intro">Official links<br>قناة التليگرام و الديسكورد</p>
  <nav class="links" aria-label="Official links">
    <a href="https://discord.gg/BGv2pTDDXn" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">◈</span> Discord Server
    </a>
    <a href="https://t.me/T7S_Cmmty" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">➤</span> Telegram Community
    </a>
  </nav>
  <footer>T7S · OFFICIAL</footer>
</main>

<script>
(() => {
  const layer = document.getElementById('meteors');
  const amount = 50;

  for (let i = 0; i < amount; i++) {
    const dot = document.createElement('span');
    dot.className = 'meteor';

    const size = (Math.random() * 1.7 + 1).toFixed(2);
    const duration = (Math.random() * 9 + 9).toFixed(2);
    const delay = (Math.random() * -18).toFixed(2);
    const drift = (Math.random() * 100 - 50).toFixed(0) + 'px';
    const tail = (Math.random() * 15 + 9).toFixed(0) + 'px';
    const bright = (Math.random() * 0.35 + 0.18).toFixed(2);

    dot.style.setProperty('--x', (Math.random() * 100).toFixed(2) + 'vw');
    dot.style.setProperty('--size', size + 'px');
    dot.style.setProperty('--duration', duration + 's');
    dot.style.setProperty('--delay', delay + 's');
    dot.style.setProperty('--drift', drift);
    dot.style.setProperty('--tail', tail);
    dot.style.setProperty('--bright', bright);
    layer.appendChild(dot);
  }
})();
</script>
</body>
</html>
