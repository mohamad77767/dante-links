<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>DANTE — Official Links</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#111;--line:#292929;--muted:#aaa;--white:#f5f5f5}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:
radial-gradient(ellipse at 50% 0%,#292929 0%,transparent 48%),
linear-gradient(180deg,#090909,#050505 72%);color:var(--white);
font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:28px 18px}
main{width:min(100%,430px);text-align:center}
.avatar{width:116px;height:116px;object-fit:cover;border-radius:50%;border:2px solid #777;box-shadow:0 0 0 7px #ffffff0a,0 12px 40px #000}
h1{font-family:Georgia,serif;font-size:42px;letter-spacing:3px;margin:23px 0 6px}
.tag{color:var(--muted);font-size:14px;letter-spacing:2px;margin:0 0 30px}
.intro{color:#c9c9c9;font-size:14px;line-height:1.7;margin:0 0 24px}
.links{display:grid;gap:13px}
a{min-height:62px;border:1px solid #373737;border-radius:14px;background:linear-gradient(135deg,#171717,#0e0e0e);
display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;text-decoration:none;font-size:17px;font-weight:700;
transition:transform .18s,border-color .18s,background .18s}
a:hover{transform:translateY(-2px);border-color:#aaa;background:#1d1d1d}
.icon{width:23px;height:23px;display:inline-grid;place-items:center;font-size:20px}
footer{margin-top:35px;color:#666;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>
<main>
  <img class="avatar" src="dante-avatar.jpg" alt="DANTE profile picture">
  <h1>DANTE</h1>
  <p class="tag">@xu5._</p>
  <p class="intro">Official links<br>تابع حساباتي ومجتمعاتي الرسمية</p>
  <nav class="links" aria-label="Official links">
    <a href="https://discord.gg/BGv2pTDDXn" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">◈</span> Discord Server
    </a>
    <a href="https://t.me/T7S_Cmmty" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">➤</span> Telegram Community
    </a>
  </nav>
  <footer>ZOC B MODS · OFFICIAL</footer>
</main>
</body>
</html>
